name: Run Tests on main PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run tests with coverage
        run: |
          npm test -- \
            --coverage \
            --coverageReporters=json-summary \
            --coverageReporters=text \
            --testResultsProcessor=jest-junit \
            --verbose
        continue-on-error: true
        id: test
        env:
          JEST_JUNIT_OUTPUT_DIR: ./test-results
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ./test-results/junit.xml
          check_name: "Test Results"
          comment_title: "Test Results"
          
      - name: Create test and coverage report
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Helper function to read JSON file safely
            function readJsonFile(filePath) {
              try {
                if (fs.existsSync(filePath)) {
                  return JSON.parse(fs.readFileSync(filePath, 'utf8'));
                }
              } catch (error) {
                console.log(`Error reading ${filePath}:`, error.message);
              }
              return null;
            }

            // Parse XML attributes without depending on their order
            function parseXmlAttributes(attributeText) {
              const attributes = {};
              const attributeRegex = /([A-Za-z_:][\w:.-]*)="([^"]*)"/g;
              let attributeMatch;

              while ((attributeMatch = attributeRegex.exec(attributeText)) !== null) {
                attributes[attributeMatch[1]] = decodeXmlEntities(attributeMatch[2]);
              }

              return attributes;
            }

            function decodeXmlEntities(value) {
              return value
                .replace(/&quot;/g, '"')
                .replace(/&apos;/g, "'")
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&amp;/g, '&');
            }

            function getTestIssueMessage(caseContent, tagName) {
              const issueRegex = tagName === 'failure'
                ? /<failure\b([^>]*)>([\s\S]*?)<\/failure>|<failure\b([^>]*)\/>/
                : /<error\b([^>]*)>([\s\S]*?)<\/error>|<error\b([^>]*)\/>/;
              const issueMatch = caseContent.match(issueRegex);

              if (!issueMatch) return null;

              const attributes = parseXmlAttributes(issueMatch[1] || issueMatch[3] || '');
              const message = attributes.message || issueMatch[2] || '';
              return decodeXmlEntities(message).replace(/\s+/g, ' ').trim();
            }
            
            // Simple XML parser for JUnit results
            function parseJUnitXML(xmlPath) {
              try {
                if (!fs.existsSync(xmlPath)) {
                  console.log('JUnit XML file not found');
                  return null;
                }
                
                const xmlContent = fs.readFileSync(xmlPath, 'utf8');
                const testSuites = [];
                
                // Extract testsuite blocks
                const testSuiteRegex = /<testsuite\b([^>]*)>([\s\S]*?)<\/testsuite>/g;
                let suiteMatch;
                
                while ((suiteMatch = testSuiteRegex.exec(xmlContent)) !== null) {
                  const suiteAttributes = parseXmlAttributes(suiteMatch[1]);
                  const suiteName = suiteAttributes.name || 'Unknown test suite';
                  const suiteContent = suiteMatch[2];
                  
                  // Extract test cases within this suite
                  const testCases = [];
                  const testCaseRegex = /<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
                  let caseMatch;
                  
                  while ((caseMatch = testCaseRegex.exec(suiteContent)) !== null) {
                    const caseAttributes = parseXmlAttributes(caseMatch[1]);
                    const testName = caseAttributes.name || 'Unknown test';
                    const testTime = caseAttributes.time;
                    const className = caseAttributes.classname;
                    const caseContent = caseMatch[2] || '';
                    
                    let status = '✅';
                    let message = '';
                    
                    const failureMessage = getTestIssueMessage(caseContent, 'failure');
                    const errorMessage = getTestIssueMessage(caseContent, 'error');

                    if (failureMessage !== null) {
                      status = '❌';
                      message = failureMessage.substring(0, 100) + (failureMessage.length > 100 ? '...' : '');
                    } else if (errorMessage !== null) {
                      status = '🔴';
                      message = errorMessage.substring(0, 100) + (errorMessage.length > 100 ? '...' : '');
                    } else if (caseContent.includes('<skipped')) {
                      status = '⏭️';
                      message = 'Test was skipped';
                    }
                    
                    testCases.push({
                      name: testName,
                      time: testTime ? `${Math.round(parseFloat(testTime) * 1000)}ms` : '',
                      status,
                      message,
                      className: className || suiteName
                    });
                  }
                  
                  testSuites.push({
                    name: suiteName,
                    tests: parseInt(suiteAttributes.tests) || 0,
                    failures: parseInt(suiteAttributes.failures) || 0,
                    errors: parseInt(suiteAttributes.errors) || 0,
                    time: suiteAttributes.time ? `${Math.round(parseFloat(suiteAttributes.time) * 1000)}ms` : '',
                    testCases
                  });
                }
                
                return testSuites;
              } catch (error) {
                console.log('Error parsing JUnit XML:', error.message);
                return null;
              }
            }
            
            // Helper function to get coverage emoji
            function getCoverageEmoji(percentage) {
              if (percentage >= 90) return '🟢';
              if (percentage >= 80) return '🟡';
              if (percentage >= 70) return '🟠';
              return '🔴';
            }
            
            // Helper function to get coverage status text
            function getCoverageStatus(percentage) {
              if (percentage >= 90) return 'Excellent';
              if (percentage >= 80) return 'Good';
              if (percentage >= 70) return 'Fair';
              if (percentage >= 60) return 'Needs Work';
              return 'Poor';
            }
            
            // Read test results and coverage data
            const coverageData = readJsonFile('./coverage/coverage-summary.json');
            const testSuites = parseJUnitXML('./test-results/junit.xml');
            const testStatus = '${{ steps.test.outcome }}';
            
            // Build comment
            let commentBody = `# 🧪 Test Results & Coverage Report\n\n`;
            
            // Test results section with detailed breakdown
            if (testSuites && testSuites.length > 0) {
              const totalTests = testSuites.reduce((sum, suite) => sum + suite.tests, 0);
              const totalFailures = testSuites.reduce((sum, suite) => sum + suite.failures + suite.errors, 0);
              const totalPassed = totalTests - totalFailures;
              
              if (testStatus === 'success') {
                commentBody += `## ✅ All Tests Passed! (${totalPassed}/${totalTests})\n\n`;
                commentBody += `🎉 Great work! All your tests are passing.\n\n`;
              } else {
                commentBody += `## ❌ Some Tests Failed (${totalPassed}/${totalTests} passed)\n\n`;
                commentBody += `🔍 ${totalFailures} test(s) failed. Please check and fix them before merging.\n\n`;
              }
              
              // Test suites summary
              commentBody += `<details>\n`;
              commentBody += `<summary>📋 <strong>Test Suites Summary</strong> (${testSuites.length} suites)</summary>\n\n`;
              commentBody += `| Test Suite | Tests | Status | Duration |\n`;
              commentBody += `|------------|-------|--------|----------|\n`;
              
              testSuites.forEach(suite => {
                const suitePassed = suite.tests - suite.failures - suite.errors;
                const suiteStatus = suite.failures + suite.errors > 0 ? '❌' : '✅';
                const suiteName = path.basename(suite.name).replace(/\.test\.(ts|js)$/, '');
                
                commentBody += `| \`${suiteName}\` | ${suitePassed}/${suite.tests} | ${suiteStatus} | ${suite.time} |\n`;
              });
              
              commentBody += `\n</details>\n\n`;
              
              // Failed tests
              const failedTests = testSuites.flatMap(suite => 
                suite.testCases
                  .filter(test => test.status === '❌' || test.status === '🔴')
                  .map(test => ({ ...test, suiteName: suite.name }))
              );
              
              if (failedTests.length > 0) {
                commentBody += `### 🚨 Failed Tests\n\n`;
                failedTests.forEach((test, index) => {
                  const shortName = test.name.length > 60 ? test.name.substring(0, 57) + '...' : test.name;
                  const suiteName = path.basename(test.suiteName).replace(/\.test\.(ts|js)$/, '');
                  commentBody += `${index + 1}. **${shortName}** — \`${suiteName}\`\n`;
                  if (test.message) {
                    commentBody += `   └─ \`${test.message}\`\n`;
                  }
                });
                commentBody += `\n`;
              } else {
                commentBody += `### ✅ Failed Tests\n\n`;
                commentBody += `No failed tests.\n\n`;
              }
            } else {
              // Fallback if JUnit parsing fails
              if (testStatus === 'success') {
                commentBody += `## ✅ All Tests Passed!\n\n`;
                commentBody += `🎉 Great work! All your tests are passing.\n\n`;
              } else {
                commentBody += `## ❌ Some Tests Failed\n\n`;
                commentBody += `🔍 Please check the failed tests and fix them before merging.\n\n`;
              }

              commentBody += `### ⚠️ Failed Tests\n\n`;
              commentBody += `Failed test details could not be read.\n\n`;
            }
            
            // Add workflow links
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            commentBody += `📋 **[View detailed workflow results](${runUrl})**\n\n`;
            
            // Coverage section
            if (coverageData && coverageData.total) {
              const { lines, statements, functions, branches } = coverageData.total;
              
              commentBody += `## 📊 Code Coverage Report\n\n`;
              
              // Main coverage table
              commentBody += `| Metric | Coverage | Status |\n`;
              commentBody += `|--------|----------|--------|\n`;
              commentBody += `| **Lines** | \`${lines.pct}%\` (${lines.covered}/${lines.total}) | ${getCoverageEmoji(lines.pct)} ${getCoverageStatus(lines.pct)} |\n`;
              commentBody += `| **Statements** | \`${statements.pct}%\` (${statements.covered}/${statements.total}) | ${getCoverageEmoji(statements.pct)} ${getCoverageStatus(statements.pct)} |\n`;
              commentBody += `| **Functions** | \`${functions.pct}%\` (${functions.covered}/${functions.total}) | ${getCoverageEmoji(functions.pct)} ${getCoverageStatus(functions.pct)} |\n`;
              commentBody += `| **Branches** | \`${branches.pct}%\` (${branches.covered}/${branches.total}) | ${getCoverageEmoji(branches.pct)} ${getCoverageStatus(branches.pct)} |\n\n`;
              
              // Overall coverage summary
              const avgCoverage = ((lines.pct + statements.pct + functions.pct + branches.pct) / 4).toFixed(1);
              
              if (avgCoverage >= 90) {
                commentBody += `### 🏆 Outstanding Coverage: ${avgCoverage}%\n`;
                commentBody += `Your code coverage is excellent! Keep up the great work.\n\n`;
              } else if (avgCoverage >= 80) {
                commentBody += `### 👍 Good Coverage: ${avgCoverage}%\n`;
                commentBody += `Your code coverage is good. Consider adding a few more tests to reach excellence.\n\n`;
              } else if (avgCoverage >= 70) {
                commentBody += `### ⚠️ Fair Coverage: ${avgCoverage}%\n`;
                commentBody += `Your code coverage is fair but could be improved. Consider adding more tests.\n\n`;
              } else {
                commentBody += `### 🔴 Low Coverage: ${avgCoverage}%\n`;
                commentBody += `Your code coverage is below recommended levels. Please add more tests.\n\n`;
              }
              
              // Top-level src folder breakdown
              const metricNames = ['lines', 'functions', 'branches', 'statements'];
              const folderCoverage = {};

              Object.entries(coverageData)
                .filter(([key]) => key !== 'total')
                .forEach(([filePath, data]) => {
                  const normalizedPath = filePath.replace(/\\/g, '/');
                  const srcIndex = normalizedPath.lastIndexOf('/src/');

                  if (srcIndex === -1) return;

                  const relativePath = normalizedPath.slice(srcIndex + 5);
                  const pathParts = relativePath.split('/');
                  const folderName = pathParts.length === 1 ? 'src (root)' : `src/${pathParts[0]}`;

                  if (!folderCoverage[folderName]) {
                    folderCoverage[folderName] = Object.fromEntries(
                      metricNames.map(metric => [metric, { covered: 0, total: 0 }])
                    );
                  }

                  metricNames.forEach(metric => {
                    folderCoverage[folderName][metric].covered += data[metric].covered;
                    folderCoverage[folderName][metric].total += data[metric].total;
                  });
                });

              const folderEntries = Object.entries(folderCoverage)
                .map(([folderName, metrics]) => {
                  const calculatedMetrics = Object.fromEntries(
                    metricNames.map(metric => {
                      const { covered, total } = metrics[metric];
                      const pct = total === 0 ? 100 : Number(((covered / total) * 100).toFixed(2));
                      return [metric, { covered, total, pct }];
                    })
                  );
                  return [folderName, calculatedMetrics];
                })
                .sort(([folderA], [folderB]) => folderA.localeCompare(folderB));

              if (folderEntries.length > 0) {
                commentBody += `### 📂 Coverage by Folder (${folderEntries.length} folders)\n\n`;
                commentBody += `| Folder | Lines | Functions | Branches | Statements |\n`;
                commentBody += `|--------|-------|-----------|----------|------------|\n`;

                folderEntries.forEach(([folderName, data]) => {
                  commentBody += `| \`${folderName}\` | ${getCoverageEmoji(data.lines.pct)} ${data.lines.pct}% | ${getCoverageEmoji(data.functions.pct)} ${data.functions.pct}% | ${getCoverageEmoji(data.branches.pct)} ${data.branches.pct}% | ${getCoverageEmoji(data.statements.pct)} ${data.statements.pct}% |\n`;
                });

                commentBody += `\n`;
              }
              
              // Coverage recommendations
              commentBody += `### 📈 Recommendations\n`;
              const lowCoverageFiles = Object.entries(coverageData)
                .filter(([key, data]) => key !== 'total' && data.lines.pct < 70)
                .slice(0, 3);
              
              if (lowCoverageFiles.length > 0) {
                commentBody += `Consider improving test coverage for:\n`;
                lowCoverageFiles.forEach(([filePath, data]) => {
                  const fileName = path.basename(filePath);
                  commentBody += `- 📄 \`${fileName}\` (${data.lines.pct}% lines covered)\n`;
                });
                commentBody += `\n`;
              } else {
                commentBody += `🎯 All files have good coverage! Great job!\n\n`;
              }
            } else {
              commentBody += `## ⚠️ Coverage data not available\n\n`;
              commentBody += `Coverage information could not be read. Make sure tests are running with coverage enabled.\n\n`;
            }
            
            // Footer
            commentBody += `---\n`;
            commentBody += `🤖 **Automated report** | `;
            commentBody += `⏱️ **Generated**: ${new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} KST | `;
            commentBody += `🔄 **Workflow**: [${context.workflow}](${runUrl})\n`;
            
            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes('🧪 Test Results & Coverage Report') && 
              comment.user.login === 'github-actions[bot]'
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
              console.log('✅ Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('✅ Created new comment');
            }
